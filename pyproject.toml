[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matador-reporting"
version = "0.9.0"
description = "Modular CSV reporting for Matador and GA4"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0,<3.0",
  "streamlit>=1.37,<2.0",
  "gspread>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
